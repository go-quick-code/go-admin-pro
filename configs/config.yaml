app:
  name: go-admin-pro
  env: dev
  port: 8080
  api-prefix: /admin-api
  web-root: ./web/dist
  # 业务时区：IANA 时区名，默认 Asia/Shanghai，启动时用 LoadLocation 校验，
  # 非法值直接启动失败。Excel 导入的无时区日期与数据库 DSN 的 loc 都由它驱动。
  timezone: Asia/Shanghai
  # CORS 白名单：Origin 精确匹配（含端口），非白名单来源不返回任何 CORS 头；
  # 为空表示不放行任何跨域。下面是开发态默认值（Vite 开发服务器），
  # 生产环境改成真实前端域名列表，或用 GAP_CORS_ALLOWED_ORIGINS（逗号分隔）覆盖。
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

database:
  # DSN 的 loc 参数由 app.timezone 生成并覆盖（URL 编码，如 loc=Asia%2FShanghai），
  # 这里无需再写 loc；旧配置遗留的 loc=Local 会被覆盖，服务器 TZ 不再影响时间解释。
  dsn: root:123456@tcp(127.0.0.1:3306)/go_admin_pro?charset=utf8mb4&parseTime=True
  max-idle-conns: 10
  max-open-conns: 100
  seed: true
  # CRM 演示数据（销售角色/账号、产品、客户、商机、合同、回款与仪表盘时间分布）。
  # 仅在 crm_customer 为空时写入；集成测试基座会显式关闭。
  seed-demo: true

jwt:
  secret: change-me-in-production-9f8a7b6c5d4e3f2a
  expire: 24h
  issuer: go-admin-pro

security:
  captcha:
    enabled: false
    width: 120
    height: 40
    length: 4
  login:
    max-fail: 5
    lock-duration: 10m

storage:
  local:
    base-path: ./uploads
    public-prefix: /files

tenant:
  enabled: true
  default-id: 1

logger:
  level: info
  format: text
