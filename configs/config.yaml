app:
  name: go-admin-pro
  env: dev
  port: 8080
  api-prefix: /admin-api
  web-root: ./web/dist
  # 业务时区：IANA 时区名，默认 Asia/Shanghai，启动时用 LoadLocation 校验，
  # 非法值直接启动失败。Excel 导入的无时区日期与数据库 DSN 的 loc 都由它驱动。
  timezone: Asia/Shanghai
  # CORS 白名单：Origin 精确匹配（含端口），非白名单来源不返回任何 CORS 头；
  # 为空表示不放行任何跨域。下面是开发态默认值（Vite 开发服务器），
  # 生产环境改成真实前端域名列表，或用 GAP_CORS_ALLOWED_ORIGINS（逗号分隔）覆盖。
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

database:
  # DSN 的 loc 参数由 app.timezone 生成并覆盖（URL 编码，如 loc=Asia%2FShanghai），
  # 这里无需再写 loc；旧配置遗留的 loc=Local 会被覆盖，服务器 TZ 不再影响时间解释。
  dsn: root:123456@tcp(127.0.0.1:3306)/go_admin_pro?charset=utf8mb4&parseTime=True
  max-idle-conns: 10
  max-open-conns: 100
  seed: true
  # CRM + OA 演示数据（销售角色/账号、产品、客户、商机、合同、回款与仪表盘
  # 时间分布；公告、请假、报销、考勤、日程、会议室、文档）。
  # 默认关闭：演示数据只在显式开启时写入（GAP_SEED_DEMO=true 或 make run-demo），
  # 避免生产/真实环境被演示账号与示例业务数据污染（PR #39 审查 P2）。
  # 开启后按表判空写入（CRM 以 crm_customer、OA 以各业务表为哨兵）；集成测试基座始终显式关闭。
  seed-demo: false

jwt:
  # 生产环境（app.env 不是 dev/test）必须改成唯一强密钥，或用 GAP_JWT_SECRET 覆盖：
  # 空值、go-admin-pro-dev-secret 与下面这个示例值都在已知默认密钥清单里，
  # 启动校验会直接报错拒绝启动（PR #39 审查 P2）。dev/test 保留默认值便于本地开发。
  secret: change-me-in-production-9f8a7b6c5d4e3f2a
  expire: 24h
  issuer: go-admin-pro

security:
  captcha:
    enabled: false
    width: 120
    height: 40
    length: 4
  login:
    max-fail: 5
    lock-duration: 10m

storage:
  local:
    # 上传文件只落磁盘，不挂公开静态目录；读取统一走鉴权下载端点
    # GET /infra/file/:id/download（PR #39 残余风险 A）。
    base-path: ./uploads

tenant:
  enabled: true
  default-id: 1

logger:
  level: info
  format: text

push:
  # 实时推送（issue #78，spec §4.5 / ADR 0013）：SSE 事件流 + 一次性票据。
  # hub 与票据都在进程内——单实例限制：多实例部署时其他实例的连接收不到
  # 事件（需要 Redis/NATS pub/sub，本轮不实现）。关闭时推送路由不注册，
  # 前端自动降级 60 秒轮询。
  enabled: true
  # 一次性票据有效期（秒级时长）。票据由 Bearer 换取，绑定 tenant/user，
  # 一次性消费，防止 JWT 进入 EventSource 的 URL。
  ticket-ttl: 30s
  # SSE 心跳间隔（注释行 : ping），保持中间层不 idle 断连。
  heartbeat: 25s

# API 访问日志（issue #80，spec §4.6 / ADR 0014）：受保护接口异步批量落库。
access-log:
  # 保留天数：cleanAccessLogs 系统级任务每日 03:00 清理超过保留期的记录
  #（缺省 30 天）。
  retention-days: 30

# IP 归属地定位（issue #82，spec §4.8.4）：登录日志分页展示归属地。
# ip2region v2 xdb 数据文件由部署侧提供（官方 releases 下载，仓库不内置）。
ip-location:
  # xdb 文件路径；留空表示未启用——登录日志归属地为空串，其余功能不受影响。
  # 文件不存在/加载失败只告警一次并退回空实现，不影响启动。
  # 可用环境变量 GAP_IP_LOCATION_XDB_PATH 覆盖。
  xdb-path: ""
