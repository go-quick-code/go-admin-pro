services:
  mysql:
    image: mysql:8.0
    container_name: go-admin-pro-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: go_admin_pro
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: .
    image: go-admin-pro:local
    container_name: go-admin-pro-migrate
    entrypoint: ["./migrate", "-c", "configs/config.yaml", "up"]
    environment:
      GAP_DATABASE_DSN: "root:123456@tcp(mysql:3306)/go_admin_pro?charset=utf8mb4&parseTime=True&loc=Local"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    image: go-admin-pro:local
    container_name: go-admin-pro
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GAP_DATABASE_DSN: "root:123456@tcp(mysql:3306)/go_admin_pro?charset=utf8mb4&parseTime=True&loc=Local"
      GAP_JWT_SECRET: "change-me-in-production-9f8a7b6c5d4e3f2a"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads

volumes:
  mysql-data:
  uploads:
